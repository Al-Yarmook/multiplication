<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فرسان جدول الضرب - تقارير الأداء</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d81b60;
            --primary-hover: #ad1457;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-top: 4px solid var(--primary); }
        h1 { color: var(--primary); margin: 0; font-size: 24px; font-weight: 900; }

        .section-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .section-card h2 { color: var(--primary); font-size: 18px; margin-bottom: 15px; font-weight: 800; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }

        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 220px; }
        .form-group label { font-size: 13px; font-weight: bold; color: #475569; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Cairo'; font-size: 13px; }

        .sections-picker-box {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            max-height: 140px;
            overflow-y: auto;
        }
        .section-chip {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            user-select: none;
            color: #334155;
        }
        .section-chip.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .options-row {
            display: flex;
            gap: 20px;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            align-items: center;
            margin-top: 10px;
        }
        .checkbox-label { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 13px; 
            font-weight: bold; 
            cursor: pointer; 
            color: #334155;
            white-space: nowrap; 
        }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; }

        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Cairo'; transition: 0.3s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
        .btn:hover { background: var(--primary-hover); }
        .btn-green { background: #2e7d32; }
        .btn-green:hover { background: #1b5e20; }
        .btn-dark { background: #334155; }
        .btn-dark:hover { background: #1e293b; }
        .btn-red { background: #d32f2f; }
        .btn-red:hover { background: #b71c1c; }
        .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }

        .report-preview-area { background: white; padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px solid #e2e8f0; }
        
        /* تصميم صفحة التقرير لتناسب الشاشات والطباعة والهواتف بدقة مطلقة */
        .report-single-page { 
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 25px;
            width: 100%;
            position: relative;
        }

        .report-header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .report-header-right { font-size: 9.5pt; font-weight: bold; color: #475569; line-height: 1.25; width: 33%; }
        .report-header-center { text-align: center; width: 34%; }
        .report-logo { max-height: 26px; display: block; margin: 0 auto 2px auto; object-fit: contain; }
        .report-title { font-size: 11pt; font-weight: 900; color: var(--primary); white-space: nowrap; }
        .report-header-left { font-size: 9.5pt; font-weight: bold; color: #475569; text-align: left; line-height: 1.25; width: 33%; }
        
        .report-meta-bar {
            display: flex;
            justify-content: space-between;
            background: #fdf2f8;
            padding: 5px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 9.5pt;
            font-weight: bold;
            color: #831843;
            border: 1px solid #fbcfe8;
        }

        .table-container { margin-bottom: 12px; }

        .report-table { width: 100%; border-collapse: collapse; font-size: 8.5pt; }
        .report-table th, .report-table td { border: 1px solid #cbd5e1; padding: 4px 6px; text-align: center; line-height: 1.25; }
        .report-table th { background: #f8fafc; color: #0f172a; font-weight: 800; font-size: 9pt; border-bottom: 2px solid var(--primary); }
        .report-table tr:nth-child(even) { background-color: #fafaf9; }

        .footer-table { 
            width: 100%; 
            border-collapse: collapse; 
            border: none !important; 
            background: #ffffff;
            margin-top: 15px;
            padding-top: 6px;
            border-top: 1px dashed #cbd5e1 !important;
        }
        .footer-table td { border: none !important; padding: 2px; text-align: center; vertical-align: top; width: 20%; background: transparent; }
        .footer-editable-cell { width: 100%; min-height: 35px; background: transparent; border: none; text-align: center; font-family: 'Cairo'; font-weight: bold; resize: none; outline: none; line-height: 1.15; color: #334155; }

        .hidden { display: none !important; }
        footer.author-footer { text-align: center; padding: 15px; color: #64748b; font-weight: bold; margin-top: 20px; }

        /* إعدادات الطباعة الدقيقة لمنع الصفحات الفارغة وتثبيت الفوتر أسفل كل شعبة */
        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            header, .section-card:not(#reportOutputCard), .btn-row, .nav-tabs, footer.author-footer, #reportHeaderTitleCard, #admin-nav-container, nav { display: none !important; }
            .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .report-preview-area { box-shadow: none !important; padding: 0 !important; margin: 0 !important; border: none !important; }
            
            .report-single-page { 
                margin: 0 !important;
                padding: 5mm 0 !important;
                border: none !important;
                border-radius: 0 !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-after: always !important;
                break-after: page !important;
                height: 97vh !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
            }
            .report-single-page:last-of-type {
                page-break-after: avoid !important;
                break-after: avoid !important;
                margin-bottom: 0 !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="welcomeTitle">📈 تقارير الأداء</h1>
            <button class="btn btn-red" onclick="logout()">تسجيل الخروج 🚪</button>
        </header>

        <!-- مكان ظهور شريط التنقل العلوي الموحد -->
        <div id="admin-nav-container"></div>

        <div class="section-card hidden" id="adminSettingsCard">
            <h2>⚙️ إعدادات الترويسة والفوتر الافتراضية (مزامنة سحابية)</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>رفع شعار رأس التقرير:</label>
                    <input type="file" id="logoUploadInput" accept="image/*" onchange="handleLogoUpload(event)">
                </div>
                <div class="form-group">
                    <label>حجم خط خلايا التذييل:</label>
                    <select id="footerFontSize" onchange="saveCloudSettings()">
                        <option value="8pt">صغير جداً (8 نقطة)</option>
                        <option value="8.5pt" selected>صغير (8.5 نقطة)</option>
                        <option value="9.5pt">متوسط (9.5 نقطة)</option>
                        <option value="10.5pt">كبير (10.5 نقطة)</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>نص الترويسة (اليمين):</label>
                    <textarea id="headerRightText" rows="3" oninput="saveCloudSettings()">مملكة البحرين
وزارة التربية والتعليم
مدرسة اليرموك الابتدائية للبنين</textarea>
                </div>
                <div class="form-group">
                    <label>نص الترويسة (اليسار):</label>
                    <textarea id="headerLeftText" rows="3" oninput="saveCloudSettings()">العام الدراسي: 2025-2026
قسم الرياضيات والعلوم</textarea>
                </div>
            </div>

            <div class="form-group" style="margin-top: 10px;">
                <label>محتوى خانات التذييل الـ 5 الافتراضية (تقبل أكثر من سطر):</label>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 5px;">
                    <textarea id="foot1" rows="3" placeholder="الخانة 1" oninput="saveCloudSettings()"></textarea>
                    <textarea id="foot2" rows="3" placeholder="الخانة 2" oninput="saveCloudSettings()"></textarea>
                    <textarea id="foot3" rows="3" placeholder="الخانة 3" oninput="saveCloudSettings()"></textarea>
                    <textarea id="foot4" rows="3" placeholder="الخانة 4" oninput="saveCloudSettings()"></textarea>
                    <textarea id="foot5" rows="3" placeholder="الخانة 5" oninput="saveCloudSettings()"></textarea>
                </div>
            </div>
        </div>

        <div class="section-card">
            <h2>🔍 فلاتر إعداد وتوليد التقرير</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>المرحلة الدراسية:</label>
                    <select id="filterGrade" onchange="updateSectionsFilter()">
                        <option value="all">جميع المراحل</option>
                        <option value="3">الصف الثالث</option>
                        <option value="4">الصف الرابع</option>
                        <option value="5">الصف الخامس</option>
                        <option value="6">الصف السادس</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label style="margin:0;">الفرقة / الشعبة (اضغط للتحديد أو الإلغاء):</label>
                        <button type="button" class="btn btn-sm btn-dark" onclick="toggleSelectAllSections()">تحديد / إلغاء الكل</button>
                    </div>
                    <div id="sectionsPickerBox" class="sections-picker-box"></div>
                </div>
            </div>

            <div class="form-row" style="margin-top: 10px;">
                <div class="form-group">
                    <label>نطاق الطلاب:</label>
                    <select id="reportScope">
                        <option value="all">جميع الطلاب (المسجلين بالسجل كاملاً)</option>
                        <option value="active">الطلاب المتفاعلين فقط</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>خيارات عرض إضافية:</label>
                    <div class="options-row">
                        <label class="checkbox-label"><input type="checkbox" id="showTeacherName" checked> إظهار اسم المعلم</label>
                        <label class="checkbox-label"><input type="checkbox" id="showReportDate" checked> إظهار تاريخ التقرير</label>
                    </div>
                </div>
            </div>

            <div style="margin-top: 12px;">
                <label style="font-size: 13px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px;">أعمدة التقرير المطلوبة:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="name" checked> اسم الطالب</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="cls" checked> الفرقة</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="total" checked> المجموع التراكمي</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="play_count" checked> عدد مرات التفعيل (اللعب)</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="weekly_badge" checked> فارس التفعيل الأسبوعي (أوسمة)</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="monthly_badge" checked> فارس التفعيل الشهري (أوسمة)</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="rank_school" checked> تصنيف المدرسة</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="rank_section" checked> تصنيف الفرقة</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="rank_grade" checked> تصنيف المرحلة</label>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button class="btn" onclick="generateReport()">⚡ توليد وعرض التقرير</button>
            </div>
        </div>

        <div class="section-card hidden" id="reportOutputCard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;" id="reportHeaderTitleCard">
                <h2 style="border:none; margin:0; padding:0;">خيارات التصدير 📄</h2>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-green" onclick="exportToExcel()">📊 تصدير إلى Excel</button>
                    <button class="btn btn-dark" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
                </div>
            </div>

            <div class="report-preview-area" id="reportPreviewContent"></div>
        </div>
    </div>

    <footer class="author-footer">
        إعداد أ. صادق القلعاوي | مدرسة اليرموك الابتدائية للبنين 🏫✨
    </footer>

    <!-- استدعاء ملف القائمة الموحدة -->
    <script src="navbar.js"></script>

    <script>
        let currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('current_staff_user')); } catch (e) {}

        if (!currentUser) {
            window.location.href = 'staff.html';
        }

        let cloudSections = [];
        let classTeachersAssignments = [];
        let teacherAssignedClassesList = [];
        let selectedSectionsSet = new Set();
        let currentFilteredSections = [];

        let cloudSettings = {
            logo: '',
            headerRight: 'مملكة البحرين\nوزارة التربية والتعليم\nمدرسة اليرموك الابتدائية للبنين',
            headerLeft: 'العام الدراسي: 2025-2026\nقسم الرياضيات والعلوم',
            foot1: 'إعداد:\nأ. صادق القلعاوي',
            foot2: 'منسق القسم:\nأ. حسين الصيرفي',
            foot3: 'المدير المساعد:\nأ. طارق بدوي',
            foot4: 'المدير المساعد:\nأ. علي ابراهيم',
            foot5: 'مدير المدرسة:\nأ. عدنان الخيراني',
            fSize: '8.5pt'
        };

        document.addEventListener('DOMContentLoaded', async () => {
            checkUserPermissions();
            initHeaderTitle();
            await fetchCloudSettings();
            await fetchCloudData();
        });

        function checkUserPermissions() {
            const roleVal = currentUser ? String(currentUser.role || '').trim().toLowerCase() : 'teacher';
            if (roleVal === 'admin' || roleVal === 'مدير' || roleVal === 'administrator') {
                document.getElementById('adminSettingsCard').classList.remove('hidden');
            }
        }

        function initHeaderTitle() {
            const roleVal = currentUser ? String(currentUser.role || '').trim().toLowerCase() : 'teacher';
            const roleName = (roleVal === 'admin' || roleVal === 'مدير') ? 'مدير النظام' : (roleVal === 'supervisor' || roleVal === 'مشرف') ? 'مشرف' : 'معلم';
            document.getElementById('welcomeTitle').textContent = `تقارير الأداء (${currentUser.name || 'مستخدم'} - ${roleName})`;
        }

        async function fetchCloudSettings() {
            try {
                const { data } = await supabaseClient
                    .from('settings')
                    .select('*')
                    .eq('key', 'global_report_settings')
                    .limit(1);

                if (data && data.length > 0) {
                    const s = data[0];
                    cloudSettings.logo = s.logo || '';
                    if(s.foot1) cloudSettings.foot1 = s.foot1;
                    if(s.foot2) cloudSettings.foot2 = s.foot2;
                    if(s.foot3) cloudSettings.foot3 = s.foot3;
                    if(s.foot4) cloudSettings.foot4 = s.foot4;
                    if(s.foot5) cloudSettings.foot5 = s.foot5;
                    if(s.footer_size) cloudSettings.fSize = s.footer_size;
                    if(s.header_right) cloudSettings.headerRight = s.header_right;
                    if(s.header_left) cloudSettings.headerLeft = s.header_left;
                }
            } catch (err) {
                console.log("جاري جلب الإعدادات...");
            }

            document.getElementById('foot1').value = cloudSettings.foot1;
            document.getElementById('foot2').value = cloudSettings.foot2;
            document.getElementById('foot3').value = cloudSettings.foot3;
            document.getElementById('foot4').value = cloudSettings.foot4;
            document.getElementById('foot5').value = cloudSettings.foot5;
            document.getElementById('footerFontSize').value = cloudSettings.fSize;
            document.getElementById('headerRightText').value = cloudSettings.headerRight;
            document.getElementById('headerLeftText').value = cloudSettings.headerLeft;
        }

        async function saveCloudSettings() {
            cloudSettings.foot1 = document.getElementById('foot1').value;
            cloudSettings.foot2 = document.getElementById('foot2').value;
            cloudSettings.foot3 = document.getElementById('foot3').value;
            cloudSettings.foot4 = document.getElementById('foot4').value;
            cloudSettings.foot5 = document.getElementById('foot5').value;
            cloudSettings.fSize = document.getElementById('footerFontSize').value;
            cloudSettings.headerRight = document.getElementById('headerRightText').value;
            cloudSettings.headerLeft = document.getElementById('headerLeftText').value;

            try {
                const payload = {
                    key: 'global_report_settings',
                    logo: cloudSettings.logo,
                    foot1: cloudSettings.foot1,
                    foot2: cloudSettings.foot2,
                    foot3: cloudSettings.foot3,
                    foot4: cloudSettings.foot4,
                    foot5: cloudSettings.foot5,
                    footer_size: cloudSettings.fSize,
                    header_right: cloudSettings.headerRight,
                    header_left: cloudSettings.headerLeft
                };
                await supabaseClient.from('settings').upsert([payload], { onConflict: 'key' });
            } catch (err) {
                console.error("خطأ في حفظ الإعدادات سحابياً:", err);
            }
        }

        async function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    cloudSettings.logo = e.target.result;
                    await saveCloudSettings();
                    alert('✅ تم حفظ وتثبيت الشعار في السحابة بنجاح!');
                };
                reader.readAsDataURL(file);
            }
        }

        async function fetchCloudData() {
            try {
                const [stRes, ctRes] = await Promise.all([
                    supabaseClient.from('students').select('cls'),
                    supabaseClient.from('class_teachers').select('*')
                ]);

                if (ctRes.data) classTeachersAssignments = ctRes.data;

                const roleVal = currentUser ? String(currentUser.role || '').trim().toLowerCase() : 'teacher';
                const isTeacher = (roleVal === 'teacher' || roleVal === 'معلم');

                if (isTeacher && currentUser.name) {
                    const { data: teacherCtData } = await supabaseClient
                        .from('class_teachers')
                        .select('cls')
                        .eq('teacher_name', currentUser.name);
                    
                    if (teacherCtData) {
                        teacherAssignedClassesList = teacherCtData.map(item => String(item.cls).trim());
                    }
                }

                let sectionsSet = new Set();
                if (stRes.data) {
                    stRes.data.forEach(st => {
                        let c = st.cls ? String(st.cls).trim() : '';
                        if (c) sectionsSet.add(c);
                    });
                }

                cloudSections = Array.from(sectionsSet).sort();
                if (cloudSections.length === 0) {
                    cloudSections = ['3ب1', '3ب2', '4ب1', '4ب2', '4ب3', '5ب1', '5ب2', '5ب3', '6ب1', '6ب2'];
                }

                updateSectionsFilter();
            } catch (err) {
                console.error("Error fetching cloud data:", err);
                cloudSections = ['3ب1', '3ب2', '4ب1', '4ب2', '4ب3', '5ب1', '5ب2', '5ب3', '6ب1', '6ب2'];
                updateSectionsFilter();
            }
        }

        function updateSectionsFilter() {
            const gradeVal = document.getElementById('filterGrade').value;
            const boxEl = document.getElementById('sectionsPickerBox');
            boxEl.innerHTML = '';

            const roleVal = currentUser ? String(currentUser.role || '').trim().toLowerCase() : 'teacher';
            const isTeacher = (roleVal === 'teacher' || roleVal === 'معلم');
            
            let availableSections = isTeacher ? teacherAssignedClassesList : cloudSections;

            currentFilteredSections = availableSections;
            if (gradeVal !== 'all') {
                currentFilteredSections = availableSections.filter(s => s.startsWith(gradeVal));
            }

            if (currentFilteredSections.length === 0) {
                boxEl.innerHTML = '<span style="color:#666; font-size:12px;">لا توجد صفوف متاحة</span>';
                return;
            }

            currentFilteredSections.forEach(sec => {
                selectedSectionsSet.add(sec);
                let chip = document.createElement('div');
                chip.className = 'section-chip selected';
                chip.setAttribute('data-sec', sec);
                chip.innerHTML = `✓ ${sec}`;
                
                chip.onclick = function() {
                    if (selectedSectionsSet.has(sec)) {
                        selectedSectionsSet.delete(sec);
                        chip.classList.remove('selected');
                        chip.innerHTML = `${sec}`;
                    } else {
                        selectedSectionsSet.add(sec);
                        chip.classList.add('selected');
                        chip.innerHTML = `✓ ${sec}`;
                    }
                };
                boxEl.appendChild(chip);
            });
        }

        function toggleSelectAllSections() {
            const allSelected = currentFilteredSections.every(sec => selectedSectionsSet.has(sec));
            const chips = document.querySelectorAll('.section-chip');

            chips.forEach(chip => {
                let sec = chip.getAttribute('data-sec');
                if (allSelected) {
                    selectedSectionsSet.delete(sec);
                    chip.classList.remove('selected');
                    chip.innerHTML = `${sec}`;
                } else {
                    selectedSectionsSet.add(sec);
                    chip.classList.add('selected');
                    chip.innerHTML = `✓ ${sec}`;
                }
            });
        }

        function getTeacherNameForSection(sec) {
            let foundInCT = classTeachersAssignments.find(item => item.cls === sec);
            if (foundInCT && foundInCT.teacher_name) {
                return foundInCT.teacher_name;
            }
            return 'غير مسند';
        }

        async function generateReport() {
            const navContainer = document.getElementById('admin-nav-container');
            if (navContainer) navContainer.remove();

            const selectedOptions = Array.from(selectedSectionsSet);
            if (selectedOptions.length === 0) {
                alert('⚠️ يرجى اختيار شعبة واحدة على الأقل لتوليد التقرير.');
                return;
            }

            const reportScope = document.getElementById('reportScope').value;
            const activeCols = Array.from(document.querySelectorAll('.col-check:checked')).map(c => c.value);
            const showTeacher = document.getElementById('showTeacherName').checked;
            const showDate = document.getElementById('showReportDate').checked;

            const container = document.getElementById('reportPreviewContent');
            container.innerHTML = '<div style="text-align:center; padding:20px;">جاري إعداد التقارير...</div>';
            document.getElementById('reportOutputCard').classList.remove('hidden');

            try {
                const { data: studentsDbData } = await supabaseClient.from('students').select('*');
                
                const [rocket, goldmine, mountain, snake] = await Promise.all([
                    supabaseClient.from('rocket_scores').select('*'),
                    supabaseClient.from('goldmine_scores').select('*'),
                    supabaseClient.from('mountain_scores').select('*'),
                    supabaseClient.from('snake_scores').select('*')
                ]);

                let studentsMap = {};

                if (reportScope === 'all' && studentsDbData) {
                    studentsDbData.forEach(st => {
                        let name = st.name || st.student_name;
                        let cls = st.cls || st.class_name || 'غير مصنف';
                        let key = name + '_' + cls;
                        studentsMap[key] = { 
                            name, 
                            cls, 
                            total: 0, 
                            playCount: 0,
                            weeklyBadgesCount: 0, 
                            monthlyBadgesCount: 0, 
                            hasPlayed: false,
                            records: [] 
                        };
                    });
                }

                function processScores(data) {
                    if (!data) return;
                    data.forEach(item => {
                        let name = item.student_name;
                        let cls = item.cls || 'غير مصنف';
                        let key = name + '_' + cls;
                        if (!studentsMap[key]) {
                            studentsMap[key] = { 
                                name, 
                                cls, 
                                total: 0, 
                                playCount: 0,
                                weeklyBadgesCount: 0, 
                                monthlyBadgesCount: 0, 
                                hasPlayed: false,
                                records: [] 
                            };
                        }
                        let pts = item.points || 0;
                        if (pts > 0) {
                            studentsMap[key].hasPlayed = true;
                            studentsMap[key].total += pts;
                            studentsMap[key].playCount += 1;
                            studentsMap[key].records.push({
                                points: pts,
                                created_at: item.created_at ? new Date(item.created_at) : null
                            });
                        }
                    });
                }

                processScores(rocket.data);
                processScores(goldmine.data);
                processScores(mountain.data);
                processScores(snake.data);

                let now = new Date();
                let currentMonth = now.getMonth();
                let currentYear = now.getFullYear();

                let currentDayOfWeek = now.getDay();
                let startOfWeek = new Date(now);
                startOfWeek.setDate(now.getDate() - currentDayOfWeek);
                startOfWeek.setHours(0, 0, 0, 0);
                let endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);
                endOfWeek.setHours(23, 59, 59, 999);

                Object.values(studentsMap).forEach(st => {
                    let weeklyCount = 0;
                    let monthlyCount = 0;

                    st.records.forEach(rec => {
                        if (rec.created_at) {
                            if (rec.created_at >= startOfWeek && rec.created_at <= endOfWeek) {
                                weeklyCount++;
                            }
                            if (rec.created_at.getMonth() === currentMonth && rec.created_at.getFullYear() === currentYear) {
                                monthlyCount++;
                            }
                        } else {
                            monthlyCount++;
                        }
                    });

                    st.weeklyBadgesCount = weeklyCount;
                    st.monthlyBadgesCount = monthlyCount;
                });

                let allStudents = Object.values(studentsMap);
                let sortedForRank = [...allStudents].sort((a, b) => b.total - a.total);
                let htmlContent = '';

                selectedOptions.forEach((sec) => {
                    let secStudents = allStudents.filter(s => s.cls === sec);
                    secStudents.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));

                    let teacherName = getTeacherNameForSection(sec);
                    let formattedHeaderRight = cloudSettings.headerRight.replace(/\n/g, '<br>');
                    let formattedHeaderLeft = cloudSettings.headerLeft.replace(/\n/g, '<br>');

                    htmlContent += `<div class="report-single-page">`;

                    htmlContent += `
                        <div>
                            <div class="report-header-box">
                                <div class="report-header-right">${formattedHeaderRight}</div>
                                <div class="report-header-center">
                                    ${cloudSettings.logo ? `<img src="${cloudSettings.logo}" class="report-logo">` : ''}
                                    <div class="report-title">تقرير أداء الطلاب - فرسان جدول الضرب</div>
                                </div>
                                <div class="report-header-left">${formattedHeaderLeft}</div>
                            </div>
                            
                            <div class="report-meta-bar">
                                <span>📚 الشعبة الدراسية: <b>(${sec})</b></span>
                                ${showTeacher ? `<span>👨‍🏫 معلم المادة: <b>${teacherName}</b></span>` : ''}
                                ${showDate ? `<span>📅 تاريخ التقرير: <b>${new Date().toLocaleDateString('ar-BH')}</b></span>` : ''}
                            </div>
                    `;

                    if (secStudents.length === 0) {
                        htmlContent += `<p style="text-align:center; color:#666; padding:25px;">لا توجد بيانات مسجلة لطلاب هذه الشعبة.</p>`;
                    } else {
                        htmlContent += `<div class="table-container"><table class="report-table"><thead><tr>`;
                        
                        if (activeCols.includes('name')) htmlContent += `<th>اسم الطالب</th>`;
                        if (activeCols.includes('cls')) htmlContent += `<th>الفرقة</th>`;
                        if (activeCols.includes('total')) htmlContent += `<th>المجموع التراكمي</th>`;
                        if (activeCols.includes('play_count')) htmlContent += `<th>عدد مرات التفعيل (اللعب)</th>`;
                        if (activeCols.includes('weekly_badge')) htmlContent += `<th>فارس التفعيل الأسبوعي</th>`;
                        if (activeCols.includes('monthly_badge')) htmlContent += `<th>فارس التفعيل الشهري</th>`;
                        if (activeCols.includes('rank_school')) htmlContent += `<th>تصنيف المدرسة</th>`;
                        if (activeCols.includes('rank_section')) htmlContent += `<th>تصنيف الفرقة</th>`;
                        if (activeCols.includes('rank_grade')) htmlContent += `<th>تصنيف المرحلة</th>`;

                        htmlContent += `</tr></thead><tbody>`;

                        secStudents.forEach((st) => {
                            let rankSchool, rankSection, rankGrade;

                            if (!st.hasPlayed) {
                                rankSchool = 'غير مصنف';
                                rankSection = 'غير مصنف';
                                rankGrade = 'غير مصنف';
                            } else {
                                rankSchool = 'المركز ' + (sortedForRank.findIndex(x => x.name === st.name && x.cls === st.cls) + 1);
                                
                                let sectionRankList = allStudents.filter(x => x.cls === sec).sort((a, b) => b.total - a.total);
                                rankSection = 'المركز ' + (sectionRankList.findIndex(x => x.name === st.name && x.cls === st.cls) + 1);
                                
                                let gradePrefix = sec.charAt(0);
                                let gradeStudents = allStudents.filter(x => x.cls.startsWith(gradePrefix)).sort((a, b) => b.total - a.total);
                                rankGrade = 'المركز ' + (gradeStudents.findIndex(x => x.name === st.name && x.cls === st.cls) + 1);
                            }

                            htmlContent += `<tr>`;
                            if (activeCols.includes('name')) htmlContent += `<td style="text-align:right; font-weight:bold; padding-right:6px; white-space:nowrap;">${st.name}</td>`;
                            if (activeCols.includes('cls')) htmlContent += `<td>${st.cls}</td>`;
                            if (activeCols.includes('total')) htmlContent += `<td style="color:var(--primary); font-weight:900; background:#fdf2f8;">⭐ ${st.total}</td>`;
                            if (activeCols.includes('play_count')) htmlContent += `<td><b>${st.playCount}</b> 🎮</td>`;
                            if (activeCols.includes('weekly_badge')) htmlContent += `<td><b>${st.weeklyBadgesCount}</b> ⚡</td>`;
                            if (activeCols.includes('monthly_badge')) htmlContent += `<td><b>${st.monthlyBadgesCount}</b> 🌙</td>`;
                            if (activeCols.includes('rank_school')) htmlContent += `<td>${rankSchool}</td>`;
                            if (activeCols.includes('rank_section')) htmlContent += `<td>${rankSection}</td>`;
                            if (activeCols.includes('rank_grade')) htmlContent += `<td>${rankGrade}</td>`;
                            htmlContent += `</tr>`;
                        });

                        htmlContent += `</tbody></table></div>`;
                    }

                    htmlContent += `</div>`;

                    htmlContent += `
                        <table class="footer-table">
                            <tr>
                                <td><textarea class="footer-editable-cell" style="font-size: ${cloudSettings.fSize};">${cloudSettings.foot1}</textarea></td>
                                <td><textarea class="footer-editable-cell" style="font-size: ${cloudSettings.fSize};">${cloudSettings.foot2}</textarea></td>
                                <td><textarea class="footer-editable-cell" style="font-size: ${cloudSettings.fSize};">${cloudSettings.foot3}</textarea></td>
                                <td><textarea class="footer-editable-cell" style="font-size: ${cloudSettings.fSize};">${cloudSettings.foot4}</textarea></td>
                                <td><textarea class="footer-editable-cell" style="font-size: ${cloudSettings.fSize};">${cloudSettings.foot5}</textarea></td>
                            </tr>
                        </table>
                    `;

                    htmlContent += `</div>`;
                });

                container.innerHTML = htmlContent;

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:red; text-align:center;">حدث خطأ أثناء جلب بيانات التقارير.</p>`;
            }
        }

        function exportToExcel() {
            const previewArea = document.getElementById('reportPreviewContent');
            const tables = previewArea.querySelectorAll('table.report-table');
            if (tables.length === 0) {
                alert('⚠️ لا توجد بيانات لتصديرها.');
                return;
            }

            let wb = XLSX.utils.book_new();
            const selectedOptions = Array.from(selectedSectionsSet);
            
            tables.forEach((table, idx) => {
                let ws = XLSX.utils.table_to_sheet(table);
                let sheetName = selectedOptions[idx] || `الشعبة_${idx+1}`;
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
            });

            XLSX.writeFile(wb, 'Farosan_Reports.xlsx');
        }

        function logout() {
            localStorage.removeItem('current_staff_user');
            window.location.href = 'staff.html';
        }
    </script>
</body>
</html>
